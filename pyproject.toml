[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-rag-guardrail"
version = "0.1.1"
description = "Source-grounded RAG answering (ChromaDB + Ollama) with a retrieval-relevance guardrail."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Jean-François Brisson" }]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.7"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-ra --strict-markers"
markers = [
    "chroma: uses a temporary ChromaDB collection seeded with synthetic docs",
    "mocked: uses a mocked Ollama endpoint (no network)",
    "live: requires a reachable Ollama server (OLLAMA_URL); skipped otherwise",
]
